<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <title>合同审查助手 (WPS)</title>
    <!-- 移除对 Office.js 的强制引用，避免在 WPS 环境报错或拦截 -->
</head>

<body>
    <div id="root" style="padding:16px;font-family:'Microsoft YaHei',Arial,sans-serif;color:#4b5563;">
        正在加载合同审查助手...
    </div>
    <script>
        function renderWpsTaskpaneError(title, detail) {
            var root = document.getElementById('root');
            if (!root) return;
            var scripts = Array.prototype.slice.call(document.scripts || [])
                .map(function (script) { return script.src || '[inline script]'; })
                .join('\n');
            root.innerHTML = '<div style="color:#b91c1c;white-space:pre-wrap;font-family:Consolas,Microsoft YaHei,monospace;font-size:12px;line-height:1.45;">'
                + title + '\n'
                + detail + '\n\n'
                + 'Loaded scripts:\n' + scripts
                + '</div>';
        }
        window.addEventListener('error', function (event) {
            var error = event.error || {};
            var detail = [
                String(event.message || '未知脚本错误'),
                event.filename ? ('file: ' + event.filename) : '',
                event.lineno ? ('line: ' + event.lineno + ', column: ' + (event.colno || 0)) : '',
                error.stack ? ('stack:\n' + error.stack) : ''
            ].filter(Boolean).join('\n');
            renderWpsTaskpaneError('合同审查助手加载失败', detail);
        });
        window.addEventListener('unhandledrejection', function (event) {
            var reason = event.reason && (event.reason.stack || event.reason.message || event.reason);
            renderWpsTaskpaneError('合同审查助手初始化失败', String(reason || '未知异步错误'));
        });
    </script>
    <!-- webpack 会自动注入打包后的 JS/CSS -->
</body>

</html>
